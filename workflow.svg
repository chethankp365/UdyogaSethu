" font-size="16" font-weight="800" fill="#06241B">1</text><text x="93" y="94" font-size="19" font-weight="700" fill="#fff">Posted</text><rect x="53" y="108" width="70" height="18" rx="9" fill="#FF9A2E" fill-opacity=".18"/><text x="60" y="121" font-size="11" font-weight="700" fill="#FF9A2E">Provider</text><text x="53" y="141" font-size="11.5" fill="#B7E8D2">Fields validated on server</text></g><rect class="lit" style="animation-delay:0s" x="34" y="53" width="238" height="98" rx="19" fill="none" stroke="#FF9A2E" stroke-width="3.5" filter="url(#gl)"/><g class="in" style="animation-delay:0.12s"><rect x="335" y="56" width="232" height="92" rx="16" fill="#0A2E4A" fill-opacity=".75" stroke="#6FB2FF" stroke-opacity=".5" stroke-width="1.6"/><circle cx="365" cy="88" r="15" fill="#6FB2FF"/><text x="365" y="94" text-anchor="middle" font-size="16" font-weight="800" fill="#06241B">2</text><text x="391" y="94" font-size="19" font-weight="700" fill="#fff">Applied</text><rect x="351" y="108" width="56" height="18" rx="9" fill="#6FB2FF" fill-opacity=".18"/><text x="358" y="121" font-size="11" font-weight="700" fill="#6FB2FF">Worker</text><text x="351" y="141" font-size="11.5" fill="#B7E8D2">Duplicate apply blocked</text></g><rect class="lit" style="animation-delay:2s" x="332" y="53" width="238" height="98" rx="19" fill="none" stroke="#6FB2FF" stroke-width="3.5" filter="url(#gl)"/><g class="in" style="animation-delay:0.24s"><rect x="633" y="56" width="232" height="92" rx="16" fill="#0A2E4A" fill-opacity=".75" stroke="#FF9A2E" stroke-opacity=".5" stroke-width="1.6"/><circle cx="663" cy="88" r="15" fill="#FF9A2E"/><text x="663" y="94" text-anchor="middle" font-size="16" font-weight="800" fill="#06241B">3</text><text x="689" y="94" font-size="19" font-weight="700" fill="#fff">Accepted</text><rect x="649" y="108" width="70" height="18" rx="9" fill="#FF9A2E" fill-opacity=".18"/><text x="656" y="121" font-size="11" font-weight="700" fill="#FF9A2E">Provider</text><text x="649" y="141" font-s