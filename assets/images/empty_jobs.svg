<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="ejBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
  </defs>

  <rect width="200" height="200" rx="32" fill="url(#ejBg)" />
  
  <!-- Clipboard -->
  <rect x="55" y="45" width="90" height="115" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="4" />
  <rect x="75" y="35" width="50" height="16" rx="6" fill="#94A3B8" />

  <!-- Document Lines -->
  <line x1="75" y1="75" x2="125" y2="75" stroke="#E2E8F0" stroke-width="4" stroke-linecap="round" />
  <line x1="75" y1="95" x2="125" y2="95" stroke="#E2E8F0" stroke-width="4" stroke-linecap="round" />
  <line x1="75" y1="115" x2="110" y2="115" stroke="#E2E8F0" stroke-width="4" stroke-linecap="round" />

  <!-- Magnifying Glass with Sprout -->
  <circle cx="120" cy="115" r="28" fill="none" stroke="#F97316" stroke-width="6" />
  <line x1="140" y1="135" x2="165" y2="160" stroke="#F97316" stroke-width="8" stroke-linecap="round" />

  <!-- Green Sprout inside glass -->
  <path d="M 120 122 C 115 110 110 105 120 100 C 130 105 125 110 120 122 Z" fill="#10B981" />
</svg>
