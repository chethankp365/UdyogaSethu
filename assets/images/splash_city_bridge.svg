<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E6F4EA" />
      <stop offset="100%" stop-color="#C8E6C9" />
    </linearGradient>
    <linearGradient id="bridgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="50%" stop-color="#FB8C00" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>
    <linearGradient id="farmGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#0A4D2E" />
    </linearGradient>
    <linearGradient id="riverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0288D1" />
      <stop offset="100%" stop-color="#01579B" />
    </linearGradient>
  </defs>

  <!-- Sky Background -->
  <rect width="800" height="500" fill="url(#skyGrad)" />
  
  <!-- Sun -->
  <circle cx="400" cy="140" r="50" fill="#FFB74D" opacity="0.8" />
  
  <!-- Village & Farm Hill Left -->
  <path d="M 0 320 Q 200 240 400 350 L 400 500 L 0 500 Z" fill="url(#farmGrad)" />
  <!-- Trees on Hill -->
  <circle cx="80" cy="280" r="25" fill="#0F623F" />
  <circle cx="120" cy="270" r="30" fill="#0A4D2E" />
  <circle cx="160" cy="290" r="20" fill="#10B981" />
  <!-- Crops / Paddy field lines -->
  <path d="M 40 370 Q 120 330 200 380" stroke="#A7F3D0" stroke-width="4" fill="none" stroke-dasharray="8 6" />
  <path d="M 60 400 Q 140 360 220 410" stroke="#A7F3D0" stroke-width="4" fill="none" stroke-dasharray="8 6" />
  <path d="M 80 430 Q 160 390 240 440" stroke="#A7F3D0" stroke-width="4" fill="none" stroke-dasharray="8 6" />

  <!-- River Below -->
  <path d="M 0 500 Q 400 320 800 500 Z" fill="url(#riverGrad)" opacity="0.85" />

  <!-- City Skyline Right -->
  <path d="M 400 350 Q 600 240 800 320 L 800 500 L 400 500 Z" fill="#1E293B" />
  <!-- City Buildings -->
  <rect x="520" y="210" width="45" height="150" fill="#334155" rx="4" />
  <rect x="580" y="160" width="60" height="200" fill="#475569" rx="4" />
  <rect x="650" y="190" width="50" height="170" fill="#334155" rx="4" />
  <rect x="710" y="230" width="55" height="130" fill="#475569" rx="4" />
  <!-- Building Windows -->
  <rect x="595" y="180" width="10" height="12" fill="#FDE047" opacity="0.9" />
  <rect x="615" y="180" width="10" height="12" fill="#FDE047" opacity="0.9" />
  <rect x="595" y="205" width="10" height="12" fill="#FDE047" opacity="0.9" />
  <rect x="615" y="205" width="10" height="12" fill="#FDE047" opacity="0.9" />
  <rect x="665" y="210" width="8" height="10" fill="#FDE047" opacity="0.9" />
  <rect x="680" y="210" width="8" height="10" fill="#FDE047" opacity="0.9" />

  <!-- Connecting Bridge (Udyoga Sethu) -->
  <!-- Bridge Arch -->
  <path d="M 180 340 Q 400 180 620 320" fill="none" stroke="url(#bridgeGrad)" stroke-width="14" stroke-linecap="round" />
  <!-- Bridge Deck -->
  <path d="M 150 350 L 650 330" fill="none" stroke="#E65100" stroke-width="10" />
  <!-- Bridge Cables/Pillars -->
  <line x1="280" y1="280" x2="280" y2="348" stroke="#F97316" stroke-width="3" />
  <line x1="340" y1="230" x2="340" y2="345" stroke="#F97316" stroke-width="3" />
  <line x1="400" y1="210" x2="400" y2="342" stroke="#F97316" stroke-width="4" />
  <line x1="460" y1="230" x2="460" y2="338" stroke="#F97316" stroke-width="3" />
  <line x1="520" y1="280" x2="520" y2="335" stroke="#F97316" stroke-width="3" />
  
  <!-- Central Glowing Pin -->
  <circle cx="400" cy="205" r="14" fill="#F97316" />
  <circle cx="400" cy="205" r="6" fill="#FFFFFF" />
</svg>
